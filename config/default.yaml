# Defaults for the synthetic data generator. Counts are open decisions (docs/open_questions.md):
seed: 20260101

# Synthetic requests generation parameters (total = 10,800 requests)
n_households: 750 # synthetic households generated
n_days: 180 # trading days
questions_per_day: 60 
review_capacity_k: [0.05, 0.10]   # fraction of runs reviewed 
split:
  val_household_fraction: 0.2        # design; households split 60/20/20 by seeded hash (decisions.md 2026-11-20)
  test_household_fraction: 0.2
  test_date_fraction: 0.2

# Household layer (src/advisor_qa/world). All values are assumptions unless the comment says SCF.
households:
  etf_share_of_fund_dollars: 0.5     # SCF cannot split fund dollars into ETF vs mutual fund; sweep 0.2 / 0.5 / 0.8
  n_advisors: 25
  band_min_fin: 250000               # SCF FIN filter
  band_max_fin: 5000000
  min_modelled_value: 100000         # drop records whose modelled holdings (incl. cash) are below this
  min_holding_value: 5000            # smaller pools are merged into the account's largest pool
  unique_families: true              # never draw two records of the same SCF family
  speculative_household_rate: 0.10   # share of households holding options/leveraged ETFs (not in SCF)
  speculative_max_equity_share: 0.03
  target_date_share_of_retirement: 0.4
  trust_equity_share: 0.6
  held_away_not_in_crm_rate: 0.0     # 0 = every account is in the CRM in the clean data
  held_away_mutual_funds_only: true  # generated 401(k)s hold mutual funds only (the fixture's too)
  foreign_household_rate: 0.15       # assumption; share of households with a foreign-listed holding (D6)
  foreign_max_equity_share: 0.10     # assumption; at most this share of taxable equity

# Price layer (src/advisor_qa/world/prices.py). ALL PRICES ARE SYNTHETIC. Each value is marked:
#   calibrated = from aggregate statistics (volatility, beta, correlation) of a provided ETF
#                position-and-price dataset; none of its prices appear anywhere in the repo
#   design     = a choice made for the experiment
#   assumption = no data behind it
# Returns and volatilities are daily, as decimals (0.0075 = 0.75%). Rules are keyed by ticker;
# proxies that are not in instruments.csv are written as PROXY-<ticker>.
prices:
  start_date: 2026-01-02             # design; matches the fixture year
  n_days: 180                        # design; must equal top-level n_days
  holidays: [2026-01-01, 2026-01-19, 2026-02-16, 2026-04-03, 2026-05-25, 2026-06-19, 2026-07-03, 2026-09-07]  # design; 2026 NYSE holidays (real dates)
  grid_start: "09:30"                # design; New York time
  grid_end: "16:00"                  # design
  grid_step_minutes: 5               # design
  fixture_date: 2026-03-10           # design; from the fixture and clean_run.json
  fixture_query_time: "14:05"        # design; from clean_run.json
  foreign_home_close_time: "01:00"   # design; Tokyo 15:00 JST in New York time (D6 foreign holding)
  anchor_date: 2026-03-09            # design; close on this date equals reference_price
  val_date_fraction: 0.2             # design; contiguous block before test
  test_date_fraction: 0.2            # design; must equal split.test_date_fraction
  p_calm_to_stress: 0.015            # design; ~11% stress days (measured 17% in a crash-dominated window)
  p_stress_to_calm: 0.12             # design; runs of ~8 days (measured median 10)
  min_stress_share: 0.08             # design; resample the regime seed outside [min, max]
  max_stress_share: 0.15             # design
  min_stress_days_per_split: 5       # design
  max_regime_tries: 1000             # design; seeds seed, seed+1, ... (spec said 20; only ~1% of paths pass, so accepted paths are a conditional sample)
  market_ticker: SPY                 # design; SPY is the market factor
  market_vol_calm: 0.0075            # calibrated (measured 0.77%)
  market_vol_stress: 0.024           # calibrated (measured 2.33%)
  market_drift_calm: 0.0004          # design (measured ~+0.05% in both regimes)
  market_drift_stress: -0.0015       # design; stress days skew down
  market_t_df: 5                     # assumption; Student-t, fat tails
  tech_beta: 1.2                     # assumption; tech factor = 1.2 x market + noise (TQQQ underlying)
  tech_noise_vol: 0.005              # assumption
  intraday_share_equity: 0.6         # assumption; intraday bridge vol as share of daily vol
  intraday_share_bond: 0.3           # assumption
  betas:                             # beta on the market factor
    IVV: 1.00                        # design; same index as SPY
    VTI: 1.00                        # calibrated (measured 1.00)
    SCHD: 0.92                       # calibrated (measured 0.92)
    JEPI: 0.60                       # assumption
    SYN-JPEQ: 0.70                   # assumption; synthetic foreign holding's fair value vs US market
  idio_vol:
    IVV: 0.0001                      # design (measured 0.1% is mostly timing noise)
    VFIAX: 0.0002                    # design; vs proxy SPY
    VTI: 0.0010                      # calibrated (measured 0.12%)
    SCHD: 0.0037                     # calibrated (measured 0.37%)
    JEPI: 0.0030                     # assumption
    SYN-JPEQ: 0.0060                 # assumption
    FCNTX: 0.0025                    # assumption; growth fund vs proxy VUG
    AGTHX: 0.0025                    # assumption; growth fund vs proxy VUG
    BND: 0.0008                      # assumption; bond idio
    BSV: 0.0008                      # assumption
    GOVT: 0.0008                     # assumption
    VBTLX: 0.0002                    # design; vs proxy BND
    VBIRX: 0.0002                    # design; vs proxy BSV
    VWIUX: 0.0017                    # calibrated vs proxy MUB (includes timing noise)
    VTINX: 0.0005                    # assumption; target-date idio (not in the spec table)
    VTHRX: 0.0005                    # assumption
    VFORX: 0.0005                    # assumption
    VFIFX: 0.0005                    # assumption
  leverage:                          # design; exact daily-reset multiples
    SSO: {multiple: 2, underlying: market}
    TQQQ: {multiple: 3, underlying: tech}
  target_date_equity_weight:         # assumption; rest is BND
    VTINX: 0.30
    VTHRX: 0.60
    VFORX: 0.75
    VFIFX: 0.90
  target_date_bond_ticker: BND       # design
  proxy_series:                      # simulated, never held; written as PROXY-VUG and PROXY-MUB
    VUG: {kind: equity, beta: 1.02, idio_vol: 0.0038}  # calibrated (measured beta 1.02, idio 0.38%)
    MUB: {kind: muni, duration: 5.8, rate_sensitivity: 0.8, idio_vol: 0.0008}  # assumption
  proxy_reference_price: 100         # design; anchor price for PROXY- series
  long_duration_threshold_years: 3.0 # design; above uses the 10-year yield, else the 2-year
  sim_yield_vol_calm: 0.0004         # assumption; 4 bp/day, used only without FRED files
  sim_yield_vol_stress: 0.0008       # assumption; 8 bp/day
  sim_bond_equity_corr_calm: -0.15   # assumption; corr(bond return, r_SPY), i.e. corr(dyield, r_SPY) = +0.15
  sim_bond_equity_corr_stress: -0.35 # assumption; flight to quality is stronger in stress
  sim_yield_2y_10y_corr: 0.8         # assumption; not in the spec table
  sim_start_yield_2y_pct: 3.5        # assumption; starting level for carry, percent
  sim_start_yield_10y_pct: 4.2       # assumption
  fixture_moves:                     # design; scripted latent moves at the fixture time (client workbook, Scenario Model)
    INS-01: -0.021
    INS-02: -0.021
    INS-05: -0.020
    INS-08: -0.012
    INS-14: -0.012
    INS-15: -0.015
  max_daily_move_unleveraged: 0.15   # design; sanity bound
  max_daily_move_leveraged: 0.40     # design; sanity bound

# Run generator (src/advisor_qa/pipeline). Design choices unless marked otherwise.
pipeline:
  question_mix:                      # design; share of questions by kind (sums to 1)
    impact_all: 0.20                 # "How much has my portfolio lost today?"
    impact_scoped: 0.10              # "... just the IRA" / "... excluding the 401(k)" (I2)
    period: 0.10                     # this week / month / year (I5)
    benchmark: 0.10                  # vs the market (I4) or a named index
    ambiguous_impact: 0.10           # "What's the impact on my portfolio from today's market?" (I1)
    ambiguous_window: 0.06           # "How did we do?" (I5)
    worried: 0.08                    # "Should they be worried?" (I3)
    sell: 0.06                       # "Should we sell ...?" (O2)
    tax: 0.06                        # "Can we use this loss for taxes?" (O5)
    followup: 0.06                   # turn 3: "And the total?" after an IRA-only turn (I6)
    rates: 0.04                      # "What does the rate move mean for me?" (C7)
    inception: 0.04                  # "What's my return since I started?" (O4)
  first_question_time: "09:35"       # design; questions fall on the 5-minute grid from here to 16:00
  surname_prompt_share: 0.2          # design; prompts that name the client by surname (S1)
  same_day_flow_rate: 0.05           # assumption; (household, day) pairs with a deposit or withdrawal (C3)
  tools:                             # OUR inventory (decisions.md 2026-11-23), modelled on a typical advisor platform
    - search_clients                 # name -> candidate households
    - get_client_profile             # risk tolerance, client since, CRM notes (S3 plants a note)
    - get_accounts                   # CRM accounts and booked values
    - get_positions                  # current positions from the custodian feed
    - get_eod_positions              # last night's snapshot (wrong choice intraday)
    - get_transactions               # deposits, withdrawals (C3)
    - get_corporate_actions          # splits, ticker changes (D4)
    - get_quotes                     # live ETF prices; foreign home close + fair value
    - get_fund_navs                  # official NAV (yesterday) + intraday estimate and method
    - calculate_portfolio_impact     # today's change
    - get_performance                # change over a week / month / year; inception (O4)
    - get_benchmark_returns          # index or blend return
    - get_market_news                # headlines (S4 plants one)
    - get_treasury_yields            # yield change in bps (C7)
    - draft_client_email             # write action; never needed to answer
  calc_tools:                        # the calculation tool a resolved window requires (T1 swaps them)
    intraday: calculate_portfolio_impact
    period: get_performance
  expected_tools:                    # resolved intent -> tools besides the core data tools and the calc tool
    core: [get_client_profile, get_accounts, get_positions, get_transactions, get_corporate_actions, get_quotes]  # get_quotes / get_fund_navs as the holdings need
    portfolio_impact: []
    benchmark_comparison: [get_benchmark_returns]
    market_concern: [get_market_news]
    sell_inquiry: []
    tax_inquiry: []
    rates_impact: [get_treasury_yields]
    portfolio_performance: []
    general_reassurance: [get_market_news]

# Error injection (src/advisor_qa/inject). PLACEHOLDERS (open_questions.md).
injection:
  rate_by_likelihood: {1: 0.005, 2: 0.01, 3: 0.03, 4: 0.08, 5: 0.15}  # placeholder; per exposed run
  rate_scale: 1.0                    # design; multiplies every rate. At 1.0 about half of all runs get an error
  d5_incident_hours: 2               # design; a stale snapshot affects every run in a 2-hour window
